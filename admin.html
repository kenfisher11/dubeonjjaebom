<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>두번째봄 운영</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg:#F6F1EA; --panel:#FFFFFF; --ink:#2B1E1A; --muted:#86766C; --line:#E6DBCF; --sunk:#F3ECE4;
    --wine:#9E2F4B; --wine-soft:#F6E3E7; --gold:#B8925A; --green:#2F6B4F; --green-soft:#E3F0E8;
    --amber:#8A5A12; --amber-soft:#FBEFD9; --red:#A3262A; --red-soft:#F9E1E1; --side:#1A1210;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.55 Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--wine); }
  .hidden { display: none !important; }

  /* 로그인 */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
  .brand { font-weight: 700; letter-spacing: 1px; }
  .brand small { color: var(--gold); font-weight: 500; margin-left: 6px; letter-spacing: 0; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 14px; }
  input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #FCFAF7; font-size: 16px; }  /* 휴대폰에서 칸을 누를 때 화면이 확대되지 않게 */
  textarea { min-height: 72px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: transparent; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn:hover { background: var(--sunk); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--ink); color: #FAF6F1; border-color: var(--ink); }
  .btn.primary:hover { background: #3d2b25; }
  .btn.ok { background: var(--green); color: #fff; border-color: var(--green); }
  .btn.bad { background: var(--panel); color: var(--red); border-color: #E7B9BB; }
  .btn.bad:hover { background: var(--red-soft); }
  .btn.danger { background: var(--red); color: #fff; border-color: var(--red); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* 레이아웃 */
  #app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { background: var(--side); color: #E9DCC4; padding: 20px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
  aside .brand { color: #E9DCC4; padding: 0 10px 16px; }
  nav button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: none; border: 0; color: rgba(233,220,196,.78); padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; font-size: 15px; }
  nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
  nav button.on { background: rgba(233,220,196,.14); color: #fff; font-weight: 600; }
  .count { min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--wine); color: #fff; font-size: 12px; text-align: center; font-weight: 700; }
  .count.zero { background: rgba(255,255,255,.1); color: rgba(233,220,196,.5); }
  aside .me { margin-top: auto; font-size: 12px; color: rgba(233,220,196,.6); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  aside .me button { background: none; border: 1px solid rgba(233,220,196,.25); color: rgba(233,220,196,.85); border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 12px; }
  main { padding: 28px 32px 60px; min-width: 0; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .bar .grow { flex: 1; min-width: 180px; }

  /* 카드·표 */
  .grid { display: grid; gap: 12px; }
  .stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stat .k { font-size: 13px; color: var(--muted); }
  .stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat.todo { cursor: pointer; }
  .stat.todo.hot { border-color: #E7B9BB; background: #FFF8F8; }
  .stat.todo.hot .v { color: var(--wine); }
  .stat.todo.on { outline: 2px solid var(--wine); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .panel + .panel { margin-top: 12px; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .who .ph { width: 44px; height: 44px; border-radius: 50%; background: var(--sunk); object-fit: cover; flex: none; }
  .who b { font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--sunk); color: var(--ink); }
  .tag.wine { background: var(--wine-soft); color: var(--wine); }
  .tag.green { background: var(--green-soft); color: var(--green); }
  .tag.amber { background: var(--amber-soft); color: var(--amber); }
  .tag.red { background: var(--red-soft); color: var(--red); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  th { background: var(--sunk); font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #FCFAF7; }
  .tbl { overflow-x: auto; }

  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .photo { position: relative; width: 132px; }
  .photo img { width: 132px; height: 176px; object-fit: cover; border-radius: 10px; background: var(--sunk); display: block; cursor: zoom-in; }
  .photo .pb { display: flex; gap: 4px; margin-top: 6px; }
  .photo .pb .btn { flex: 1; padding: 5px 0; }
  .photo .pos { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 6px; }

  /* 대화 근거 */
  .chat { background: var(--sunk); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 80%; padding: 7px 11px; border-radius: 12px; background: #fff; font-size: 14px; white-space: pre-wrap; }
  .bubble.mine { align-self: flex-start; border: 1px solid #E7B9BB; }
  .bubble.other { align-self: flex-end; background: #fff; color: var(--muted); }
  .bubble.hit { background: var(--red-soft); border-color: var(--red); }
  .bubble .t { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .signal { border-left: 3px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; gap: 8px; }
  .signal.ai { border-color: var(--amber); } .signal.report { border-color: var(--wine); } .signal.review { border-color: var(--gold); }
  .quote { background: var(--sunk); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; }

  /* 상세 서랍 */
  .drawer-bg { position: fixed; inset: 0; background: rgba(26,18,16,.35); z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; padding: 24px; box-shadow: -10px 0 40px rgba(0,0,0,.15); }
  .drawer .close { position: sticky; top: 0; float: right; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .decide { display: grid; gap: 10px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .seg button.on.danger { background: var(--red); border-color: var(--red); }
  .hint { font-size: 12px; color: var(--muted); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .presets button:hover { color: var(--ink); border-color: var(--gold); }

  /* 가입 추이 */
  .spark { display: flex; align-items: flex-end; gap: 4px; height: 90px; }
  .spark div { flex: 1; background: var(--gold); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .spark div:hover::after { content: attr(data-t); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .spark-x { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 4px; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 40; font-size: 14px; max-width: calc(100% - 32px); }
  #toast.bad { background: var(--red); }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 30; display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
  #viewer img, #viewer iframe { max-width: 100%; max-height: 92vh; border-radius: 8px; background: #fff; }
  #viewer iframe { width: min(900px, 100%); height: 92vh; border: 0; }
  #viewer .vnote { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 8px; }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-content: start; }  /* 휴대폰: 위 메뉴 띠가 늘어나지 않게 */
    aside { position: sticky; height: auto; z-index: 10; padding: 10px 12px; flex-direction: row; align-items: center; overflow-x: auto; }
    aside .brand { padding: 0 8px 0 0; white-space: nowrap; }
    nav { display: flex; gap: 4px; }
    nav button { width: auto; white-space: nowrap; padding: 8px 10px; }
    aside .me { margin: 0 0 0 auto; padding: 0; flex-direction: row; }
    aside .me span { display: none; }
    main { padding: 20px 16px 60px; }
    .kv { grid-template-columns: 90px 1fr; }
    .drawer { padding: 16px; }
  }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="brand">두번째봄 <small>운영</small></div>
    <p class="meta" style="margin:6px 0 0">운영자 계정으로만 들어올 수 있어요.</p>
    <label class="f">이메일<input type="email" id="email" autocomplete="username" required></label>
    <label class="f">비밀번호<input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="btn primary" style="width:100%;margin-top:18px;padding:12px" id="loginBtn">들어가기</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="brand">두번째봄 <small>운영</small></div>
    <nav id="nav"></nav>
    <div class="me"><span id="meName"></span><button id="pwBtn">비밀번호 바꾸기</button><button id="outBtn">나가기</button></div>
  </aside>
  <main id="main"></main>
</div>

<div id="drawerBg" class="drawer-bg hidden"></div>
<div id="drawer" class="drawer hidden"></div>
<div id="viewer" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://qkuwyenlyvzyyfaybyec.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WVU3NyHcfenbmL1cGYHMzA_nZG7mJSK';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storageKey: 'dbb-admin' } });

// ── 표시용 문구 ─────────────────────────────────────────────
const L = {
  kind: { identity: '본인인증', photo: '실물 사진', marital: '혼인관계', job: '직업', income: '소득', home: '자가' },
  status: { onboarding: '가입 중', pending_review: '검수 대기', active: '활동 중', suspended: '정지', banned: '영구 정지', withdrawn: '탈퇴' },
  statusTag: { onboarding: '', pending_review: 'amber', active: 'green', suspended: 'red', banned: 'red', withdrawn: '' },
  case: { pending: '새 건', reviewing: '검토 중', no_issue: '문제 없음', warned: '경고', suspended: '정지', banned: '영구 정지' },
  caseTag: { pending: 'wine', reviewing: 'amber', no_issue: 'green', warned: 'amber', suspended: 'red', banned: 'red' },
  source: { ai: 'AI 탐지', report: '신고', review: '만남 후기' },
  action: { no_issue: '문제 없음', warn: '경고', suspend: '정지', ban: '영구 정지', restore: '복구' },
  report: { money_request: '돈 요구', married_suspected: '기혼 의심', photo_mismatch: '사진과 다름', harassment: '괴롭힘·불쾌한 말', other: '기타' },
  issue: { no_show: '약속에 안 나옴', photo_mismatch: '사진과 다름', money_talk: '돈 얘기', harassment: '불쾌한 언행', none: '없음' },
  want: { yes: '또 보고 싶음', no: '아니요', unsure: '잘 모르겠음' },
  review: { pending: '대기', approved: '승인', rejected: '반려', expired: '만료' },
  gender: { M: '남', F: '여' },
  marital: { never_married: '미혼', divorced: '이혼', widowed: '사별' },
};
const REJECT_PRESETS = {
  marital: ['서류 글자가 흐려 읽을 수 없어요. 밝은 곳에서 다시 찍어 주세요.', '발급일이 3개월이 지났어요. 최근 서류로 다시 올려 주세요.', '본인 이름이 보이지 않아요. 전체 화면이 나오게 다시 올려 주세요.'],
  job: ['재직이나 사업을 확인할 수 있는 서류가 아니에요. 재직증명서나 사업자등록증을 올려 주세요.', '서류 글자가 흐려 읽을 수 없어요.'],
  income: ['금액을 확인할 수 있는 서류가 아니에요. 소득금액증명원을 올려 주세요.', '서류 글자가 흐려 읽을 수 없어요.'],
  home: ['본인 소유를 확인할 수 없어요. 등기부등본(소유자 표시 포함)을 올려 주세요.', '서류 글자가 흐려 읽을 수 없어요.'],
  photo: ['셀카와 프로필 사진이 같은 분인지 확인되지 않았어요. 정면 셀카를 다시 찍어 주세요.'],
  identity: ['본인인증 정보가 맞지 않아요. 다시 인증해 주세요.'],
};
const INCOME_BANDS = ['5천만 원 이상', '7천만 원 이상', '1억 이상', '2억 이상'];
const NOTICE_PRESETS = {
  warn: ['대화 중 투자·송금 이야기는 운영 정책상 할 수 없어요. 반복되면 이용이 제한돼요.', '상대방이 불편해하는 표현이 확인됐어요. 서로 존중하는 대화를 부탁드려요.'],
  suspend: ['대화에서 금전 요구가 확인되어 30일 동안 이용을 멈췄어요.', '여러 회원의 신고가 확인되어 조사하는 동안 이용을 멈췄어요.'],
  ban: ['투자 권유와 송금 요구가 반복 확인되어 이용을 영구히 제한했어요.', '기혼 사실이 확인되어 이용을 영구히 제한했어요.'],
};
const ERR = {
  ADMIN_ONLY: '운영자 계정이 아니에요.', NOT_PENDING: '이미 처리된 건이에요. 목록을 새로 고쳐 주세요.',
  REASON_REQUIRED: '사유를 적어 주세요.', NOTICE_REQUIRED: '회원에게 보낼 사유를 적어 주세요.',
  NO_DOCUMENT: '서류 파일이 없어요 (이미 처리되었거나 회원이 올리지 않음).', NOT_FOUND: '찾을 수 없어요.',
  'Invalid login credentials': '이메일이나 비밀번호가 맞지 않아요.',
};

// ── 도우미 ─────────────────────────────────────────────────
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (d, withTime = true) => {
  if (!d) return '-';
  const t = new Date(d);
  const s = t.toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric' });
  return withTime ? s + ' ' + t.toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }) : s;
};
const ago = (d) => {
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 1) return '방금'; if (m < 60) return `${m}분 전`; if (m < 1440) return `${Math.round(m / 60)}시간 전`;
  return `${Math.round(m / 1440)}일 전`;
};
const tag = (text, cls = '') => `<span class="tag ${cls}">${esc(text)}</span>`;
function msg(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e);
  for (const k of Object.keys(ERR)) if (m.includes(k)) return ERR[k];
  return m;
}
function toast(text, bad = false) {
  const t = $('#toast'); t.textContent = text; t.className = bad ? 'bad' : ''; clearTimeout(toast.h);
  toast.h = setTimeout(() => t.className = 'hidden', 3200);
}
async function rpc(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw error;
  return data;
}
async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { toast(msg(e), true); } finally { if (btn) btn.disabled = false; }
}
// 비공개 사진은 짧은 서명 주소로만 봄 (10분)
const urlCache = new Map();
async function signPhotos(paths) {
  const need = [...new Set(paths.filter((p) => p && !urlCache.has(p)))];
  if (need.length) {
    const { data } = await sb.storage.from('profile-photos').createSignedUrls(need, 600);
    (data || []).forEach((d) => d.signedUrl && urlCache.set(d.path, d.signedUrl));
  }
  return (p) => urlCache.get(p) || '';
}
function who(u, extra = '') {
  if (!u) return '<span class="meta">(탈퇴한 회원)</span>';

// 서류 한 건
function docItem(v) {
  const kind = v.kind;
  const presets = (REJECT_PRESETS[kind] || []).map((p) => `<button type="button" data-p="${esc(p)}">${esc(p.length > 26 ? p.slice(0, 26) + '…' : p)}</button>`).join('');
  return `<div class="item" data-id="${esc(v.id)}">
    <div class="row">${who(v.user)}<div class="actions">${tag(L.kind[kind] || kind, 'wine')} <span class="meta">${ago(v.submitted_at)} 제출</span></div></div>
    ${v.detail && v.detail.match_score != null ? `<div class="meta">셀카 대조 점수 ${Math.round(v.detail.match_score * 100)}% — 90% 미만이라 사람이 확인해요.</div>` : ''}
    <div class="row">
      ${v.has_document ? `<button class="btn" data-open="1">서류 열기${v.opened ? ' (열람함)' : ''}</button>` : '<span class="meta">올린 파일 없음</span>'}
      ${kind === 'income' ? `<select data-band style="width:auto"><option value="">소득 구간 선택</option>${INCOME_BANDS.map((b) => `<option>${b}</option>`).join('')}</select>` : ''}
      <div class="actions"><button class="btn ok" data-ok="1">승인</button><button class="btn bad" data-rej="1">반려…</button></div>
    </div>
    <div class="decide hidden" data-rejbox>
      <textarea placeholder="반려 사유 (회원에게 그대로 전달돼요)"></textarea>

      <div class="row"><button class="btn danger" data-ok="0">반려 보내기</button></div>
    </div></div>`;
}
function bindDoc(main, v) {
  const item = main.querySelector(`.item[data-id="${v.id}"]`); if (!item) return;
  const open = item.querySelector('[data-open]');
  if (open) open.onclick = () => run(open, async () => {
    const path = await rpc('admin_open_document', { p_verification: v.id });
    const { data, error } = await sb.storage.from('verification-docs').createSignedUrl(path, 120);
    if (error) throw error;
    openViewer(data.signedUrl, /\.pdf$/i.test(path), '2분 동안만 열려요 · 저장·캡처하지 마세요');
    open.textContent = '서류 열기 (열람함)';
  });
  item.querySelector('[data-rej]').onclick = () => item.querySelector('[data-rejbox]').classList.toggle('hidden');
  item.querySelectorAll('.presets button').forEach((b) => b.onclick = () => { item.querySelector('textarea').value = b.dataset.p; });
  item.querySelectorAll('[data-ok]').forEach((b) => b.onclick = () => run(b, async () => {
    const approve = b.dataset.ok === '1';
    const args = { p_verification: v.id, p_approve: approve, p_reason: null, p_detail: null };
    if (approve && v.kind === 'income') {
      const band = item.querySelector('[data-band]').value;
      if (!band) throw new Error('소득 구간을 골라 주세요. 회원 프로필에는 금액 대신 이 구간만 보여요.');
      args.p_detail = { ...(v.detail || {}), income_band: band };
    }
    if (!approve) { args.p_reason = item.querySelector('textarea').value.trim(); if (!args.p_reason) throw new Error('REASON_REQUIRED'); }
    await rpc('admin_decide_verification', args);
    item.innerHTML = `<div class="row">${who(v.user)}<div class="actions">${tag(L.kind[v.kind], 'wine')} ${approve ? tag('승인함 · 서류 삭제', 'green') : tag('반려함 · 서류 삭제', 'red')}</div></div>`;
    hydratePhotos(item); refreshCounts();
  }));
}

async function openCase(id) {
  let d;
  try { d = await rpc('admin_case_detail', { p_case: id }); } catch (e) { return toast(msg(e), true); }
  const c = d.case, u = d.target;
  const sig = d.signals.map((s) => {
    let body = '';
    if (s.message) {
      const ctx = s.message.context || [];
      body = `<div class="chat">${ctx.map((x) => `<div class="bubble ${x.mine ? 'mine' : 'other'} ${x.id === s.message.id ? 'hit' : ''}">${esc(x.body)}<span class="t">${x.mine ? esc(u.real_name) : '상대'} · ${fmt(x.created_at)}</span></div>`).join('')}</div>`;
    }
    if (s.report) body = `<div class="kv"><dt>신고한 분</dt><dd>${esc(s.report.reporter?.real_name)} <span class="meta">${esc(s.report.reporter?.age)}세</span></dd><dt>사유</dt><dd>${esc(L.report[s.report.reason] || s.report.reason)}</dd></div>${s.report.detail ? `<div class="quote">${esc(s.report.detail)}</div>` : ''}`;
    if (s.review) body = `<div class="kv"><dt>후기 쓴 분</dt><dd>${esc(s.review.reviewer?.real_name)}</dd><dt>문제</dt><dd>${(s.review.issues || []).map((i) => tag(L.issue[i] || i, 'amber')).join(' ')}</dd><dt>또 만나고 싶은지</dt><dd>${esc(L.want[s.review.want_again])}</dd></div>${s.review.detail ? `<div class="quote">${esc(s.review.detail)}</div>` : ''}`;
    return `<div class="signal ${s.source}"><div>${tag(L.source[s.source], s.source === 'ai' ? 'amber' : 'wine')} <b>${esc(s.reason)}</b> <span class="meta">${fmt(s.created_at)}</span></div>${body}</div>`;
  }).join('');
  const acts = d.actions.map((a) => `<div class="panel"><div>${tag(L.action[a.action], a.action === 'restore' || a.action === 'no_issue' ? 'green' : 'red')} <span class="meta">${fmt(a.created_at)}</span></div>
    <div class="kv" style="margin-top:8px"><dt>내부 메모</dt><dd>${esc(a.note)}</dd>${a.user_notice ? `<dt>회원 안내</dt><dd>${esc(a.user_notice)}</dd>` : ''}
    ${a.appeal ? `<dt>이의신청</dt><dd>${tag(L.review[a.appeal.status])} ${esc(a.appeal.body)}</dd>` : ''}</div></div>`).join('');
  const open = c.status === 'pending' || c.status === 'reviewing';
  const suspended = u.status === 'suspended' || u.status === 'banned';
  openDrawer(`
    <h1>검토 건</h1><p class="sub">${tag(L.case[c.status], L.caseTag[c.status])} · 열린 날 ${fmt(c.opened_at)}</p>
    <div class="panel">${who(u)}
      <dl class="kv" style="margin-top:12px"><dt>받은 신고</dt><dd>${u.reports_received}건</dd><dt>매칭</dt><dd>${u.matches}번</dd>
      <dt>직업</dt><dd>${esc(u.job_title || '-')}</dd><dt>소개</dt><dd>${esc(u.bio || '-')}</dd>
      <dt>이전 검토</dt><dd>${d.past_cases.length ? d.past_cases.map((p) => tag(L.case[p.status], L.caseTag[p.status]) + ' <span class="meta">' + fmt(p.opened_at, false) + '</span>').join(' ') : '없음'}</dd></dl>
      <div style="margin-top:10px"><button class="btn sm" id="toMember">회원 정보 전체 보기</button></div></div>
    <h2>근거 ${d.signals.length}개</h2><div class="list">${sig || '<div class="empty">근거가 없어요.</div>'}</div>
    <h2>조치</h2>
    <div class="panel decide" id="actBox">
      <div class="seg" id="actSeg">
        ${(open ? ['no_issue', 'warn', 'suspend', 'ban'] : []).concat(suspended ? ['restore'] : []).concat(!open && !suspended ? ['warn', 'suspend', 'ban'] : [])
          .map((k) => `<button type="button" data-a="${k}" class="${k === 'suspend' || k === 'ban' ? 'dz' : ''}">${L.action[k]}</button>`).join('')}
      </div>
      <label class="f">판단 근거 (내부 기록 · 필수)<textarea id="actNote" placeholder="예: 3번 메시지에서 코인 투자 권유 + 계좌 송금 요구 확인"></textarea></label>
      <label class="f hidden" id="noticeWrap">회원에게 보낼 사유 (그대로 전달돼요 · 필수)<textarea id="actNotice"></textarea><div class="presets" id="noticePresets"></div></label>
      <div class="hint" id="actHint">조치를 골라 주세요.</div>
      <div class="row"><button class="btn primary" id="actGo" disabled>조치 저장</button></div>
    </div>
    ${acts ? `<h2>처리 이력</h2>${acts}` : ''}`);
  $('#toMember').onclick = () => openMember(u.id);
  let pick = null;
  const hints = { no_issue: '건을 닫아요. 회원에게 알림은 가지 않아요.', warn: '회원에게 경고 알림이 가요. 이용은 그대로예요.',
    suspend: '바로 이용이 멈춰요. 회원은 이의신청을 할 수 있어요.', ban: '이용이 영구히 막히고 모든 대화가 닫혀요. 회원은 이의신청을 할 수 있어요.',
    restore: '정지를 풀고 다시 활동하게 해요.' };
  $('#actSeg').querySelectorAll('button').forEach((b) => b.onclick = () => {
    pick = b.dataset.a;
    $('#actSeg').querySelectorAll('button').forEach((x) => x.className = x === b ? 'on' + (x.classList.contains('dz') ? ' danger' : '') : (x.classList.contains('dz') ? 'dz' : ''));
    const needNotice = ['warn', 'suspend', 'ban'].includes(pick);
    $('#noticeWrap').classList.toggle('hidden', !needNotice);
    $('#noticePresets').innerHTML = (NOTICE_PRESETS[pick] || []).map((p) => `<button type="button">${esc(p)}</button>`).join('');
    $('#noticePresets').querySelectorAll('button').forEach((x) => x.onclick = () => { $('#actNotice').value = x.textContent; });
    $('#actHint').textContent = hints[pick]; $('#actGo').disabled = false;
    $('#actGo').className = 'btn ' + (pick === 'suspend' || pick === 'ban' ? 'danger' : 'primary');
    $('#actGo').textContent = L.action[pick] + ' 저장';
  });
  $('#actGo').onclick = () => run($('#actGo'), async () => {
    const note = $('#actNote').value.trim(), notice = $('#actNotice').value.trim();
    if (note.length < 2) throw new Error('판단 근거를 두 글자 이상 적어 주세요.');
    if (['warn', 'suspend', 'ban'].includes(pick) && !notice) throw new Error('NOTICE_REQUIRED');
    if (pick === 'ban' && !confirmBan()) return;
    await rpc('admin_act', { p_case: c.id, p_action: pick, p_note: note, p_user_notice: notice || null });
    toast(L.action[pick] + ' 처리했어요'); refreshCounts(); openCase(c.id);
    if (current === 'cases') PAGES.cases($('#main'));
  });
}
// 영구 정지는 한 번 더 확인 (브라우저 확인창 대신 버튼 두 번 누르기)
let banArmed = 0;
function confirmBan() {
  if (Date.now() - banArmed < 5000) { banArmed = 0; return true; }
  banArmed = Date.now(); $('#actGo').textContent = '정말 영구 정지할까요? 한 번 더 누르세요'; return false;
}

// 회원 상세
const REGIONS = [['서울','강동구','서울 강동',37.5301,127.1238],['서울','송파구','서울 송파',37.5146,127.1059],['서울','강남구','서울 강남',37.5172,127.0473],
  ['서울','서초구','서울 서초',37.4837,127.0324],['서울','광진구','서울 광진',37.5385,127.0823],['서울','성동구','서울 성동',37.5634,127.0369],
  ['서울','동작구','서울 동작',37.5124,126.9393],['서울','관악구','서울 관악',37.4784,126.9516],['경기','성남시 분당구','성남 분당',37.3827,127.1189],
  ['경기','성남시 수정구','성남 수정',37.4504,127.1456],['경기','성남시 중원구','성남 중원',37.4305,127.1371],['경기','하남시','경기 하남',37.5393,127.2148],
  ['경기','용인시 수지구','용인 수지',37.3223,127.0977],['경기','용인시 기흥구','용인 기흥',37.2803,127.1146],['경기','과천시','경기 과천',37.4292,126.9876],
  ['경기','광주시','경기 광주',37.4294,127.2551]];   // 앱 lib/regions.ts 와 같게 유지
async function openMember(id) {
  let d;
  try { d = await rpc('admin_member_detail', { p_user: id }); } catch (e) { return toast(msg(e), true); }
  const u = d.user, n = d.counts;
  openDrawer(`
    <h1>${esc(u.real_name)}</h1><p class="sub">${esc(u.display_name)} · ${esc(L.gender[u.gender])} · ${esc(u.birth_date)} (${esc(u.age)}세) · ${esc(u.region)}</p>
    <div class="panel"><dl class="kv">
      <dt>상태</dt><dd>${tag(L.status[u.status], L.statusTag[u.status])} ${u.is_hidden ? tag('프로필 숨김') : ''}</dd>
      <dt>찾는 분</dt><dd>${esc(L.gender[u.seeking])} ${esc(u.age_min)}~${esc(u.age_max)}세</dd>
      <dt>혼인</dt><dd>${esc(L.marital[u.marital] || '-')}</dd><dt>직업</dt><dd>${esc(u.job_title || '-')}</dd>
      <dt>소개</dt><dd>${esc(u.bio || '-')}</dd>
      <dt>요금제</dt><dd>${d.plan && d.plan.plan === 'plus' ? '플러스 · ' + fmt(d.plan.expires_at, false) + '까지' : '무료'}</dd>
      <dt>활동</dt><dd>편지 보냄 ${n.letters_sent} · 받음 ${n.letters_received} · 매칭 ${n.matches}</dd>
      <dt>신고</dt><dd>받음 ${n.reports_received} · 함 ${n.reports_made}</dd>
      <dt>가입 · 최근</dt><dd>${fmt(u.created_at)} · ${ago(u.last_active_at)}</dd>
      <dt>회원 번호</dt><dd class="meta">${esc(u.id)}</dd></dl></div>
    <h2>사진</h2><div class="photos">${d.photos.length ? d.photos.map((p) => `<div class="photo"><span class="pos">${p.position === 8 ? '그 시절' : p.position + 1}</span><img data-path="${esc(p.path)}" alt=""><div class="meta">${esc(L.review[p.review])}</div></div>`).join('') : '<span class="meta">없음</span>'}</div>
    <h2>인증</h2>${d.verifications.length ? `<div class="tbl"><table><thead><tr><th>항목</th><th>상태</th><th>확인한 달</th><th>메모</th></tr></thead><tbody>
      ${d.verifications.map((v) => `<tr><td>${esc(L.kind[v.kind])}</td><td>${tag(L.review[v.status], v.status === 'approved' ? 'green' : v.status === 'rejected' ? 'red' : 'amber')}</td>
        <td>${v.verified_month ? esc(v.verified_month.slice(0, 7).replace('-', '.')) : '-'}</td>
        <td class="meta">${esc(v.reject_reason || v.detail?.income_band || (v.detail?.match_score != null ? '대조 ' + Math.round(v.detail.match_score * 100) + '%' : ''))}</td></tr>`).join('')}</tbody></table></div>` : '<p class="meta">없음</p>'}
    <h2>검토 건</h2>${d.cases.length ? `<div class="list">${d.cases.map((c) => `<button class="btn" style="text-align:left" data-case="${esc(c.id)}">${tag(L.case[c.status], L.caseTag[c.status])} ${fmt(c.opened_at)}</button>`).join('')}</div>` : '<p class="meta">없음</p>'}
    <h2>사는 지역 바꾸기</h2>
    <div class="panel decide"><p class="meta">회원이 문의하기로 요청했을 때만 바꿔 주세요. 바꾸면 회원에게 알림이 가요.</p>
      <div class="row"><select id="rgSel">${REGIONS.map((r, i) => `<option value="${i}" ${r[2] === u.region ? 'selected' : ''}>${esc(r[2])}</option>`).join('')}</select>
      <button class="btn" id="rgGo">지역 바꾸기</button></div></div>
    <h2>검토 건 직접 열기</h2>
    <div class="panel decide"><textarea id="ocReason" placeholder="예: 고객센터 전화 제보 — 카카오톡으로 옮기자며 돈을 빌려 달라고 함"></textarea>
      <div class="row"><button class="btn primary" id="ocGo">검토 건 열기</button></div></div>`);
  $('#drawer').querySelectorAll('[data-case]').forEach((b) => b.onclick = () => openCase(b.dataset.case));
  $('#rgGo').onclick = () => run($('#rgGo'), async () => {
    const r = REGIONS[+$('#rgSel').value];
    if (r[2] === u.region) { toast('지금과 같은 지역이에요.', true); return; }
    await rpc('admin_set_region', { p_user: u.id, p_sido: r[0], p_sigungu: r[1], p_label: r[2], p_lat: r[3], p_lng: r[4] });
    toast(r[2] + '(으)로 바꿨어요. 회원에게 알림이 가요.'); openMember(u.id);
  });
  $('#ocGo').onclick = () => run($('#ocGo'), async () => {
    const cid = await rpc('admin_open_case', { p_user: u.id, p_reason: $('#ocReason').value });
    toast('검토 건을 열었어요'); refreshCounts(); openCase(cid);
  });
}

// ── 로그인 ─────────────────────────────────────────────────
async function enter() {
  try {
    const me = await rpc('admin_me');
    const { data } = await sb.auth.getUser();
    $('#meName').textContent = (data.user?.email || '') + ' · ' + ({ owner: '대표', moderator: '운영', reviewer: '검수' }[me.role] || me.role);
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    const v = location.hash.slice(1);
    go(VIEWS.some((x) => x.key === v) ? v : 'home');
    clearInterval(enter.t); enter.t = setInterval(refreshCounts, 60000);
  } catch (e) {
    await sb.auth.signOut();
    showLogin(msg(e));
  }
}
function showLogin(err = '') {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#loginErr').textContent = err;
}
$('#loginForm').onsubmit = (e) => {
  e.preventDefault();
  run($('#loginBtn'), async () => {
    $('#loginErr').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
    if (error) { $('#loginErr').textContent = msg(error); return; }
    await enter();
  });
};
$('#outBtn').onclick = async () => { await sb.auth.signOut(); showLogin(); };
$('#pwBtn').onclick = () => {
  openDrawer(`<h1>비밀번호 바꾸기</h1><p class="sub">12자 이상, 다른 곳에서 쓰지 않는 비밀번호로 정해 주세요.</p>
    <div class="panel decide"><label class="f">새 비밀번호<input type="password" id="np1" autocomplete="new-password"></label>
    <label class="f">한 번 더<input type="password" id="np2" autocomplete="new-password"></label>
    <div class="row"><button class="btn primary" id="npGo">바꾸기</button></div></div>`);
  $('#npGo').onclick = () => run($('#npGo'), async () => {
    const a = $('#np1').value, b = $('#np2').value;
    if (a.length < 12) throw new Error('12자 이상으로 정해 주세요.');
    if (a !== b) throw new Error('두 비밀번호가 달라요.');
    const { error } = await sb.auth.updateUser({ password: a }); if (error) throw error;
    toast('비밀번호를 바꿨어요'); closeDrawer();
  });
};

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) enter(); else showLogin();
})();
</script>
